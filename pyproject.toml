[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-agent"
version = "0.1.0"
description = "Autonomous Sleeper Fantasy Football Agent with LLM Reasoning and Browser Automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Team"}
]
dependencies = [
    "requests>=2.28.0",
    "google-genai>=2.3.0"
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0"
]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
sleeper-agent = "sleeper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
