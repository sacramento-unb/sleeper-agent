services:
  sleeper-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sleeper_agent_app
    ports:
      - "${PORT:-8088}:8000"
    environment:
      - SLEEPER_USERNAME=${SLEEPER_USERNAME:-your-sleeper-username}
      - SLEEPER_LEAGUE_ID=${SLEEPER_LEAGUE_ID:-demo-league-id}
      - SLEEPER_SEASON=${SLEEPER_SEASON:-2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - BROWSER_DRY_RUN=${BROWSER_DRY_RUN:-true}
      - SQLITE_DB_PATH=/app/data/sleeper_agent.db
      - SLEEPER_CACHE_DIR=/app/data
      - AGENT_STATE_PATH=/app/data/agent_state.json
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - HOST=0.0.0.0
      - PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./data:/app/.cache/sleeper
    restart: "no"
